  <!-- House icon -->
  <path d="M30 60 L50 40 L70 60 L70 75 L55 75 L55 65 L45 65 L45 75 L30 75 Z" fill="white"/>
  
  <!-- Door -->
  <rect x="45" y="65" width="10" height="10" fill="#1f77b4"/>
  
  <!-- Windows -->
  <rect x="35" y="55" width="8" height="6" fill="#1f77b4"/>
  <rect x="57" y="55" width="8" height="6" fill="#1f77b4"/>
  
  <!-- Chimney -->
